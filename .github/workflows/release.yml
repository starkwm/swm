name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'starkwm/swm' && !github.event.deleted
    permissions:
      contents: write
    uses: starkwm/workflows/.github/workflows/release-bottle.yml@a7080f23323dd61120f9ee402c410502b042271a
    with:
      version-prefix: swm version
    secrets:
      HOMEBREW_TAP_APP_PRIVATE_KEY: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
