name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-test-and-smoke:
    name: Lint, test, and smoke
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Swift version
        run: swift --version

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Release smoke test
        run: make smoke
